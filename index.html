<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>logiStroy</title>
<style>
:root{color-scheme:light;--n:#1d314a;--a:#bd9c7b;--g:#1f9d55;--l:#f5f3f0;--b:#dde2ec;--t:#1c2333;--m:#6b7488;--w:#b26a00;--r:#c0392b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;font:15px/1.45 "Segoe UI",system-ui,Roboto,sans-serif;color:var(--t);background:#fff}
h1{font-size:24px;margin:0 0 14px;color:var(--n)}h2{font-size:18px;margin:18px 0 8px;color:var(--n)}h3{margin:0 0 6px}
.shell{display:flex;min-height:100vh}
aside{width:250px;background:var(--l);border-right:1px solid var(--b);padding:16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.co{font-weight:700;color:var(--n)}.m{color:var(--m)}small{font-size:12px}
.nv{all:unset;cursor:pointer;padding:12px;border-radius:10px;font-size:15px}.nv:hover{background:#e4e9f3}.nv.on{background:var(--n);color:#fff;box-shadow:inset 4px 0 0 var(--a)}
main{flex:1;padding:20px;min-width:0;max-width:1200px}
.demo{background:#fff6e0;border:1px solid #f0d28a;color:#6b4a00;border-radius:10px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.warn{background:#fdeaea;border:1px solid #efb4ae;color:var(--r);border-radius:10px;padding:10px 12px;margin-bottom:12px;font-weight:600}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:14px}
.kp div{background:var(--l);border-radius:12px;padding:12px;border-top:3px solid var(--a)}.kp b{display:block;font-size:22px;color:var(--n)}.kp span{font-size:12px;color:var(--m)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.card{border:1px solid var(--b);border-radius:14px;padding:16px;background:#fff;margin-bottom:12px}.cl{cursor:pointer}.cl:hover{border-color:var(--n)}
.best{border:2px solid var(--g)}.big{font-size:26px;font-weight:700;color:var(--n)}
.row,.fb,.hd{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:10px 0}.hd{justify-content:space-between}
.bt{cursor:pointer;border:0;border-radius:10px;padding:11px 18px;font-size:15px;font-weight:600;color:#fff;background:var(--n);text-decoration:none;display:inline-block}
.bt.s{background:#fff;color:var(--n);border:1px solid var(--n)}.bt.big{padding:18px 26px;font-size:17px}.bt.d{background:var(--r)}
.ln{all:unset;cursor:pointer;color:var(--n);text-decoration:underline;display:inline-block;margin:6px 0}
input,select,textarea{font:inherit;padding:9px;border:1px solid var(--b);border-radius:8px;background:#fff;color:var(--t);max-width:100%}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--m);margin-bottom:10px}label input,label select,label textarea{font-size:15px;color:var(--t)}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 12px}
.tw{overflow-x:auto;border:1px solid var(--b);border-radius:12px;margin-bottom:12px}
table{border-collapse:collapse;width:100%;font-size:14px}th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--b);white-space:nowrap}th{background:var(--l);font-size:12px;color:var(--m)}
tr.cl:hover{background:#f7f9fd}
.pill{display:inline-block;border-radius:99px;padding:2px 10px;font-size:12px;background:#e4e9f3;color:var(--n)}.pill.g{background:#dff3e6;color:var(--g)}.pill.w{background:#fff1d6;color:var(--w)}.pill.r{background:#fbe1de;color:var(--r)}
.tabs{display:flex;gap:6px;margin-bottom:14px}.tabs button{flex:1;padding:10px;border:1px solid var(--b);background:#fff;border-radius:10px;cursor:pointer;font:inherit}.tabs .on{background:var(--n);color:#fff}
.auth{max-width:460px;margin:30px auto;padding:0 16px}
dl{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0}dt{color:var(--m)}dd{margin:0}
#md{position:fixed;inset:0;background:rgba(10,20,40,.5);display:none;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:9}
#md>div{background:#fff;border-radius:16px;padding:20px;max-width:640px;width:100%}
#ts{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--n);color:#fff;padding:10px 18px;border-radius:10px;display:none;z-index:10}
.err{color:var(--r)}.lg{display:block;width:100%;max-width:190px;mix-blend-mode:multiply}.auth .lg{max-width:280px;margin:0 auto 12px}h1{border-bottom:2px solid var(--a);padding-bottom:6px}.auth h1{border:0}
@media(max-width:800px){.shell{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap}aside .co,aside .m{width:100%}aside .lg{max-width:130px}main{padding:14px}dl{grid-template-columns:1fr}}
@media print{aside,.demo,.noprint,#ts{display:none}}
</style>
</head>

async function api(m,u,b){const o={method:m,credentials:'same-origin'};if(m!=='GET'){o.headers={'Content-Type':'application/json'};o.body=JSON.stringify(b||{})}const r=await fetch('/api/'+u,o);let j={};try{j=await r.json()}catch(e){}if(r.status===401&&me){me=null;render()}if(!r.ok){const er=new Error(j.error||'Ошибка сервера');er.status=r.status;throw er}return j}

function objCard(){const o=S.objects.find(x=>x.id===X.oid),f=F.oh=F.oh||{};
 let h='';if(X.h){const l=filt(myDel().filter(d=>d.oid===o.id),f);h=`<h2>История доставок</h2>${fbar('oh','q')}${table(l,['date','num','svc','what','cost','who','st','rc'])}<div class="card"><b>Итого расходов на доставки по объекту: ${rub(sum(exp(l)))}</b></div>`}
 return`<button class="ln" onclick="go('obj')">← Все объекты</button><div class="hd"><h1>${esc(o.name)}</h1>${me.role==='admin'?`<button class="bt s" onclick="objForm('${o.id}')">Редактировать</button>`:''}</div><div class="card"><dl>${[['Адрес',o.addr],['Место на карте',o.map],['Как добраться',o.route],['Подъезд и разгрузка',o.access],['Принимает доставки',o.recv],['Телефон',o.phone],['Запасной телефон',o.phone2],['Альтернативный контакт',o.alt],['Комментарии',o.note]].map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)||'—'}</dd>`).join('')}</dl><a class="ln" target="_blank" rel="noopener" href="https://yandex.ru/maps/?text=${encodeURIComponent(o.addr)}">Открыть на карте ↗</a></div><div class="row"><button class="bt big" onclick="go('order',{oid:'${o.id}'})">🚚 ЗАКАЗАТЬ ДОСТАВКУ</button><button class="bt big s" onclick="X.h=1;render()">📋 ИСТОРИЯ ДОСТАВОК</button></div>${h}`}
function objForm(id){const o=id?S.objects.find(x=>x.id===id):{};modal(`<h2 style="margin-top:0">${id?'Редактирование объекта':'Новый объект'}</h2><form onsubmit="return saveObj(event,'${id||''}')">${inp('name','Название объекта',o.name,'text',1)}${inp('addr','Полный адрес',o.addr,'text',1)}${inp('map','Местоположение на карте (координаты или ссылка)',o.map)}<label>Как добраться<textarea name="route" rows="2">${esc(o.route)}</textarea></label><label>Особенности подъезда и разгрузки<textarea name="access" rows="2">${esc(o.access)}</textarea></label><div class="f2">${inp('recv','ФИО принимающего доставки',o.recv,'text',1)}${inp('phone','Основной телефон',o.phone,'tel',1)}${inp('phone2','Запасной телефон',o.phone2,'tel')}${inp('alt','Альтернативное контактное лицо',o.alt)}</div><label>Дополнительные комментарии<textarea name="note" rows="2">${esc(o.note)}</textarea></label><div class="row"><button class="bt">Сохранить</button><button type="button" class="bt s" onclick="closeM()">Отмена</button></div></form>`)}
function saveObj(e,id){e.preventDefault();const v=fv(e.target);if(id)Object.assign(S.objects.find(o=>o.id===id),v);else S.objects.push({id:uid(),cid:me.cid,...v});save();closeM();render();toast('Объект сохранён');return false}
/* ---------- order ---------- */
const snap=()=>fv(Q('of'));
function chObj(id){const o=S.objects.find(x=>x.id===id);X.draft={...snap(),oid:id,to:o.addr,cr:o.recv+', '+o.phone};X.offers=null;render()}
const hsh=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))>>>0;return h};
function calcO(e){const D=snap(),km=3+hsh(D.from+D.to)%22,w=+D.weight||1,p=+D.places||1,r=n=>Math.round(n/10)*10;X.draft=D;X.offers={ya:{cost:r(320+km*27+w*3.2+p*40),eta:(35+km*3)+' мин',tar:w>30?'Грузовой':'Экспресс'},dv:{cost:r(290+km*31+w*2.6+p*50),eta:(50+km*2)+' мин',tar:w>30?'Грузовой':'Обычный'}};render()}
function orderVia(s){if(JSON.stringify(snap())!==JSON.stringify(X.draft))return toast('Данные изменены — нажмите «Рассчитать стоимость» ещё раз');
 const D=X.draft,n=(s==='ya'?'ЯД-':'ДВ-')+(5000+Math.floor(Math.random()*4999)),d={id:uid(),cid:me.cid,num:n,date:new Date().toISOString(),...D,svc:s,cost:X.offers[s].cost,uid:me.id,status:'Ожидает подтверждения',pay:'wait',receipt:null};
 S.deliveries.push(d);save();modal(`<h2 style="margin-top:0">Отправляем заказ в ${SV[s]}…</h2><p>Ожидаем подтверждение от службы (демо-имитация). Заказ ${n} пока <b>не оформлен</b>.</p>`);
 setTimeout(()=>{charge(d);d.status='Курьер назначен';save();modal(`<h2 style="margin-top:0">✅ Заказ ${n} подтверждён</h2><p>Служба: ${SV[s]}. Стоимость: ${rub(d.cost)}.<br><small class="m">Демо-имитация: настоящий заказ не создавался, деньги не списывались.</small></p><button class="bt" onclick="closeM();go('del')">К списку доставок</button>`)},1400)}
function charge(d){if(d.pay!=='wait')return;d.pay='paid';const x=S.dep[d.cid][d.svc];x.bal-=d.cost;x.ops.push({date:new Date().toISOString(),type:'out',sum:d.cost,note:'Списание за '+d.num+' (демо)'});d.receipt=rcpt(d.num,d.cost,d.svc)}
/* ---------- delivery details ---------- */
function openD(id){const d=S.deliveries.find(x=>x.id===id),ed=me.role!=='acc',rows=[['Номер',d.num],['Дата оформления',dt(d.date)],['Объект',objName(d.oid)],['Откуда',d.from],['Куда',d.to],['Что',d.what],['Вес / габариты / места',[d.weight&&d.weight+' кг',d.dims,d.places&&d.places+' мест'].filter(Boolean).join(' · ')],['Служба',SV[d.svc]],['Стоимость',rub(d.cost)+' ('+PAY[d.pay]+')'],['Оформил',uName(d.uid)],['Комментарий',d.note]];
 modal(`<h2 style="margin-top:0">Доставка ${esc(d.num)}</h2><dl>${rows.map(([a,b])=>`<dt>${a}</dt><dd>${esc(b)||'—'}</dd>`).join('')}</dl>${ed?`<label style="margin-top:12px">Статус (демо-имитация обновления из API службы)<select onchange="setSt('${id}',this.value)">${ST.map(s=>`<option ${s===d.status?'selected':''}>${s}</option>`).join('')}</select></label>`:`<p>Статус: <b>${d.status}</b></p>`}<div class="row">${d.receipt?`<button class="bt s" onclick="openR('${id}')">Открыть чек</button><a class="bt s" download="${esc(d.receipt.name)}" href="${d.receipt.url}">Скачать чек</a>`:''}<label class="bt s" style="margin:0;flex-direction:row">Загрузить чек<input type="file" hidden onchange="upR('${id}',this)"></label>${can('order')?`<button class="bt" onclick="rep('${id}')">Повторить доставку</button>`:''}</div>`)}
function setSt(id,v){const d=S.deliveries.find(x=>x.id===id);if(v==='Отменена'&&d.status!=='Отменена'){if(d.pay==='paid'){d.pay='refund';const x=S.dep[d.cid][d.svc];x.bal+=d.cost;x.ops.push({date:new Date().toISOString(),type:'in',sum:d.cost,note:'Возврат за '+d.num+' (демо)'})}}else if(!['Создана','Ожидает подтверждения','Отменена'].includes(v))charge(d);d.status=v;save();render();toast('Статус обновлён')}
function rep(id){const d=S.deliveries.find(x=>x.id===id);closeM();go('order',{oid:d.oid,pre:{oid:d.oid,from:d.from,to:d.to,what:d.what,weight:d.weight,dims:d.dims,places:d.places,cs:d.cs,cr:d.cr,note:d.note}})}
function upR(id,i){const f=i.files[0];if(!f)return;const d=S.deliveries.find(x=>x.id===id);if(f.size>500000){d.receipt={name:f.name,url:''};save();render();return toast('Файл большой: сохранено только имя (в демо)')}const r=new FileReader();r.onload=()=>{d.receipt={name:f.name,url:r.result};save();render();openD(id);toast('Чек загружен')};r.readAsDataURL(f)}
function openR(id){const r=S.deliveries.find(x=>x.id===id).receipt,u=r.url;modal(`<h2 style="margin-top:0">${esc(r.name)}</h2>${u.startsWith('data:image')?`<img src="${u}" style="max-width:100%">`:u.startsWith('data:text/plain')?`<pre style="white-space:pre-wrap">${esc(decodeURIComponent(u.split(',')[1]))}</pre>`:'<p>Предпросмотр недоступен для этого типа файла.</p>'}<div class="row"><a class="bt s" download="${esc(r.name)}" href="${u}">Скачать</a><button class="bt" onclick="closeM()">Закрыть</button></div>`)}

function addIn(e,s){e.preventDefault();const v=+fv(e.target).sum;if(v<=0)return false;const x=dep()[s];x.bal+=v;x.ops.push({date:new Date().toISOString(),type:'in',sum:v,note:'Пополнение, внесено вручную'});save();closeM();render();toast('Учётный баланс обновлён');return false}
function ops(s){const o=[...dep()[s].ops].sort((a,b)=>b.date.localeCompare(a.date));modal(`<h2 style="margin-top:0">История операций: ${SV[s]}</h2><div class="tw"><table><tr><th>Дата</th><th>Тип</th><th>Сумма</th><th>Примечание</th></tr>${o.map(x=>`<tr><td>${dt(x.date)}</td><td>${x.type==='in'?'Пополнение':'Списание'}</td><td>${rub(x.sum)}</td><td>${esc(x.note)}</td></tr>`).join('')||'<tr><td colspan="4">Операций нет</td></tr>'}</table></div><button class="bt" onclick="closeM()">Закрыть</button>`)}
/* ---------- team ---------- */
async function setLow(e){try{await api('PUT','company',{low:+fv(e.target).low||0});await refresh();toast('Порог сохранён')}catch(x){toast(x.message)}}
async function blk(id){const u=S.users.find(x=>x.id===id);try{await api('PUT','users/'+id,{blocked:!u.blocked});await refresh()}catch(x){toast(x.message)}}
function empForm(id){const u=id?S.users.find(x=>x.id===id):{role:'emp',objs:[]};modal(`<h2 style="margin-top:0">${id?'Сотрудник':'Новый сотрудник'}</h2><form onsubmit="return saveEmp(event,'${id||''}')">${inp('name','ФИО',u.name,'text',1)}<div class="f2">${inp('phone','Телефон',u.phone,'tel',1)}${inp('email','Email',u.email,'email',1)}${inp('pos','Должность',u.pos)}<label>Роль<select name="role">${Object.entries(RL).map(([k,v])=>`<option value="${k}" ${u.role===k?'selected':''}>${v}</option>`).join('')}</select></label></div><label>Доступные объекты</label>${S.objects.filter(o=>o.cid===me.cid).map(o=>`<label style="flex-direction:row;gap:8px"><input type="checkbox" name="o_${o.id}" ${u.objs==='all'||(u.objs||[]).includes(o.id)?'checked':''}>${esc(o.name)}</label>`).join('')}${id?'':inp('pass','Временный пароль (не короче 6 символов)','','text',1)}<div class="row"><button class="bt">Сохранить</button><button type="button" class="bt s" onclick="closeM()">Отмена</button></div></form>`)}
async function saveEmp(e,id){e.preventDefault();const v=fv(e.target),objs=S.objects.filter(o=>o.cid===me.cid&&v['o_'+o.id]).map(o=>o.id),d={name:v.name,phone:v.phone,email:v.email,pos:v.pos,role:v.role,objs:v.role!=='emp'?'all':objs};try{if(id)await api('PUT','users/'+id,d);else await api('POST','users',{...d,pass:v.pass});closeM();await refresh();toast('Сотрудник сохранён')}catch(x){toast(x.message)}return false}
/* ---------- init ---------- */
(async()=>{try{load(await api('GET','me'))}catch(e){me=null}render();setInterval(()=>{if(me&&!st&&V!=='order'&&Q('md').style.display!=='flex'&&!document.activeElement.matches('input,select,textarea'))refresh()},30000)})();
</script>
